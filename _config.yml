# Minimal Mistakes remote_theme を使う最小構成例
title: "森 爽真 ポートフォリオ"
email: "umasouma646@gmail.com"
description: "ポートフォリオサイト（職務経歴・作品・連絡先）"
baseurl: "" # GitHub Pages の場合、ユーザーサイトなら空。project pagesなら /repo
url: "https://Moriumaso.github.io" # 自分の GitHub Pages URL に置換
remote_theme: "mmistakes/minimal-mistakes"
theme: minimal-mistakes-jekyll
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Minimal Mistakes の設定例（必要に応じて追加）
footer:
  content: "© Mori soma"
author:
  name: "森 爽真"
  avatar: "/assets/images/avatar.jpg" # 任意。存在しなければ外す

# ナビゲーション（トップに表示）
nav:
  - title: "Home"
    url: /
  - title: "Projects"
    url: /projects/
  - title: "Resume"
    url: /resume/
  - title: "Blog"
    url: /blog/
  - title: "Contact"
    url: /contact/

# Collections（作品や職歴は collection にするのが編集しやすい）
collections:
  projects:
    output: true
    permalink: /projects/:path/
  jobs:
    output: true
    permalink: /jobs/:path/

# page layout defaults（必要なら設定）
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "single"
      author_profile: true

# その他（カスタム CSS や追加設定）
sass:
  sass_dir: _sass
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
